<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabe & Boni's Wedding</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>Gabe + Boni</h1>
        <p class="login-tagline">Are getting married!</p>

        <form id="login-form">
            <label for="password">Enter Password</label>
            <input type="text" id="password" placeholder="Enter password">
            <button type="submit" class="btn btn-primary">Enter Site</button>
        </form>

        <p class="login-error" id="error-message">Incorrect password. Please try again.</p>
        <p class="login-hint">Check your invitation for the password!</p>
    </div>

    <script>
        const GUEST_PASSWORD = 'partytime';
        const CAMPER_PASSWORD = 'campers2027';

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value.toLowerCase().trim();
            const errorMessage = document.getElementById('error-message');

            if (password === CAMPER_PASSWORD) {
                sessionStorage.setItem('accessLevel', 'camper');
                window.location.href = 'index.html';
            } else if (password === GUEST_PASSWORD) {
                sessionStorage.setItem('accessLevel', 'guest');
                window.location.href = 'index.html';
            } else {
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
